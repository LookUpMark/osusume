appId: com.lookupmark.osusume
productName: Osusume
directories:
  output: release
# everything is bundled (UI + server .mjs): no node_modules inside the .app
files:
  - dist/**
  - dist-electron/**
  - fixtures/** # demo dataset: powers the auto-fallback when AniList is down
  - package.json
asar: false # the sidecar and the frontend load straight from the bundle dir; asar buys nothing here
# Python sidecar (PyInstaller onedir from `pnpm build:pyserver`): Contents/Resources/desktop-server/
extraResources:
  - from: build/pyserver/dist/osusume-server
    to: desktop-server
    filter:
      - "**/*"
mac:
  category: public.app-category.entertainment
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  identity: null # unsigned (ad-hoc): first launch needs right-click → Open
  darkModeSupport: true
dmg:
  artifactName: Osusume-${version}-${arch}.dmg
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
win:
  icon: build/icon.png # png ≥256px: electron-builder genera l'ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Osusume-Setup-${version}.exe
  # unsigned → SmartScreen: "More info → Run anyway" (analogo right-click→Apri del mac)
linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
appImage:
  artifactName: Osusume-${version}.AppImage
