<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Osusume app icon: torii gate line-art sul canvas paper del brand
       (stile logo-mark: stroke ink #242629, kasagi = unico dettaglio sage
       #829F68; niente gradienti — posture "no dominant gradients") -->
  <rect width="1024" height="1024" rx="232" fill="#ffffff"/>
  <rect x="10" y="10" width="1004" height="1004" rx="222" fill="none" stroke="#dbdbdb" stroke-width="2"/>
  <g fill="none" stroke="#242629" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- gakuzuka: center strut between kasagi and shimaki -->
    <path d="M512 262 V 376"/>
    <!-- shimaki: second beam -->
    <path d="M250 376 H 774"/>
    <!-- pillars -->
    <path d="M312 376 V 786"/>
    <path d="M712 376 V 786"/>
    <!-- nuki: crossing beam -->
    <path d="M236 548 H 788"/>
  </g>
  <!-- kasagi: curved top lintel, ends lifted (unico elemento sage, come il
       simbolo AI del logo-mark OD); stroke indipendente dal gruppo -->
  <path d="M186 272 Q 512 202, 838 272" fill="none" stroke="#829F68" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
