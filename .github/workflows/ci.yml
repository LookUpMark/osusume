name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # actions pinned by version + restricted permissions; supply-chain finding 13.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --project backend --frozen --dev
      # explicit backend/tests: pins the pytest rootdir to backend/ (its pyproject
      # carries the config) while the e2e tests spawn run_dev.py with cwd = repo root
      - run: uv run --project backend pytest backend/tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # build the image (no push) so Dockerfile/compose stay green without local Docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: docker build -t osusume:ci .
      - name: smoke — container boots and serves /api/health
        run: |
          docker run -d --name smoke -e HOST=0.0.0.0 -p 3000:3000 osusume:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then echo ok; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - if: always()
        run: docker rm -f smoke
