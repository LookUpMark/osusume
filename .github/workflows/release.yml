name: release

# Builds the installers (macOS DMG, Windows NSIS, Linux AppImage) and attaches
# them to the GitHub release. Each job runs on its native OS: the frontend, the
# PyInstaller sidecar (via uv + scripts/build-pyserver.mjs) and the Electron
# shell are all built for the host platform.
# The tag must match package.json version (v0.4.0 ↔ "0.4.0").
# workflow_dispatch (no tag) = build-only dry run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # release create/upload — the only job in the repo with write access

jobs:
  dmg:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag $TAG != package.json version $WANT"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - run: pnpm build && pnpm build:electron

      - name: Build the Python sidecar (PyInstaller onedir)
        run: node scripts/build-pyserver.mjs

      - name: Build DMG (arm64)
        run: pnpm exec electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build — skip keychain probing

      - name: Upload DMG to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(release/*.dmg)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no DMG produced"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --generate-notes --latest
          fi

  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag $TAG != package.json version $WANT"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - run: pnpm build && pnpm build:electron

      - name: Build the Python sidecar (PyInstaller onedir)
        run: node scripts/build-pyserver.mjs

      - name: Build NSIS installer (x64)
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(release/*.exe)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no installer produced"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --generate-notes --latest
          fi

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag $TAG != package.json version $WANT"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - run: pnpm build && pnpm build:electron

      - name: Build the Python sidecar (PyInstaller onedir)
        run: node scripts/build-pyserver.mjs

      - name: Build AppImage (x64)
        run: pnpm exec electron-builder --linux --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload AppImage to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(release/*.AppImage)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no AppImage produced"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --generate-notes --latest
          fi
